    <script>
      (function() {
        function removeBanners() {
          var all = document.querySelectorAll('*');
          for (var i = 0; i < all.length; i++) {
            var el = all[i];
            if (el && el.innerText && /built\s*with|ai\s*arena/i.test(el.innerText) && el !== document.body && el !== document.documentElement && el.id !== 'root') {
              var parent = el.parentElement;
              if (parent && parent !== document.body && !parent.querySelector('#root')) {
                parent.remove();
              } else {
                el.remove();
              }
            }
          }
        }
        if (document.readyState === 'loading') {
          document.addEventListener('DOMContentLoaded', removeBanners);
        } else {
          removeBanners();
        }
        var obs = new MutationObserver(removeBanners);
        obs.observe(document.documentElement, { childList: true, subtree: true });
      })();
